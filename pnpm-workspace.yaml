packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11+ exige aprobar explícitamente los scripts de instalación de dependencias
# (strictDepBuilds). Prisma y esbuild sí necesitan su postinstall; workerd no se usa.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  workerd: false

# No enlazamos automáticamente "agent skills" de las dependencias.
skills:
  dirs: []
