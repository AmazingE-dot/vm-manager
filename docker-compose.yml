services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vmuser
      POSTGRES_PASSWORD: vmpass
      POSTGRES_DB: vmdb
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vmuser -d vmdb']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
