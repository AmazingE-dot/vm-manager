<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFX VM Manager</title>
    <link rel="icon" type="image/webp" href="/brand/ifx-mark.webp" />
    <script>
      // Aplica el tema antes del primer render para evitar el parpadeo (FOUC).
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) {
            document.documentElement.classList.add('dark');
          }
        } catch (_error) {
          /* Sin localStorage: se usa el tema claro. */
        }
      })();
    </script>
    <style>
      /* Splash mínimo antes de que React monte (evita la pantalla en blanco). */
      html {
        background-color: #f5f5f7;
      }
      html.dark {
        background-color: #000000;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-splash img {
        width: 64px;
        height: auto;
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Cargando">
        <img src="/brand/ifx-mark.webp" alt="" width="615" height="670" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
